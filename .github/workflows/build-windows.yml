name: Build portable ctav-yad for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - .github/workflows/build-windows.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools and project dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $archive = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'Project ZIP not found in repository root.' }
          $destination = Join-Path $env:RUNNER_TEMP 'ctav-yad-source'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination -Force
          $files = Get-ChildItem -Path $destination -Recurse -File
          $entry = $null
          foreach ($candidate in @('main.py','app.py','gui.py','launcher.py','run.py','__main__.py')) {
            $entry = $files | Where-Object { $_.Name -eq $candidate } | Select-Object -First 1
            if ($entry) { break }
          }
          if (-not $entry) { $entry = $files | Where-Object { $_.Extension -eq '.py' } | Select-Object -First 1 }
          if (-not $entry) { throw 'No Python entry-point was found in the archive. The project may use a different language or needs a specific launcher.' }
          Write-Host ('ENTRY POINT: ' + $entry.FullName)
          $requirements = $files | Where-Object { $_.Name -eq 'requirements.txt' } | Select-Object -First 1
          if ($requirements) {
            Write-Host ('Installing dependencies from: ' + $requirements.FullName)
            python -m pip install -r $requirements.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Installing requirements.txt failed.' }
          } else {
            Write-Host 'No requirements.txt found; trying project metadata if available.'
            $pyproject = $files | Where-Object { $_.Name -eq 'pyproject.toml' } | Select-Object -First 1
            if ($pyproject) {
              python -m pip install (Split-Path $pyproject.FullName -Parent)
              if ($LASTEXITCODE -ne 0) { throw 'Installing pyproject.toml project failed.' }
            }
          }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Installing PyInstaller failed.' }
          "ENTRY_POINT=$($entry.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOURCE_ROOT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build one-file EXE with models bundled
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $work = Join-Path $env:RUNNER_TEMP 'pyinstaller-work'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $args = @('-m','PyInstaller','--onefile','--clean','--noconfirm','--name','KtavYad','--distpath',$dist,'--workpath',$work,'--specpath',$env:RUNNER_TEMP)
          # Embed the complete extracted project tree, including model weights and auxiliary data.
          $args += @('--add-data', ($env:SOURCE_ROOT + ';.'))
          foreach ($pkg in @('torch','torchvision','cv2','numpy','PIL','sklearn','transformers','onnxruntime','scipy')) {
            python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec(sys.argv[1]) else 1)" $pkg
            if ($LASTEXITCODE -eq 0) {
              Write-Host ('Collecting package data: ' + $pkg)
              $args += @('--collect-all',$pkg)
            }
          }
          $args += $env:ENTRY_POINT
          Write-Host ('Running PyInstaller for: ' + $env:ENTRY_POINT)
          & python @args
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed. See the log above for the missing dependency or packaging error.' }
          $exe = Join-Path $dist 'KtavYad.exe'
          if (-not (Test-Path $exe)) { throw 'Build completed without producing KtavYad.exe.' }
          Write-Host ('EXE SIZE: ' + (Get-Item $exe).Length + ' bytes')
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: ctav-yad-Windows-portable-EXE
          path: dist/KtavYad.exe
          if-no-files-found: error

name: Build KtavYad portable Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - scripts/build-portable.ps1
      - .github/workflows/build-portable.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build self-contained portable EXE
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KtavYad-Windows-Portable
          path: |
            dist/KtavYad-Portable.exe
            dist/README-Model.txt
          if-no-files-found: error
          retention-days: 30

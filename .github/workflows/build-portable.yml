name: Build and publish KtavYad Windows Release

on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - scripts/build-portable.ps1
      - .github/workflows/build-portable.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build unpacked folder with KtavYad.exe
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Download ONNX model for separate Release asset
        shell: pwsh
        run: |
          $modelDir = Join-Path $env:GITHUB_WORKSPACE "dist/model-asset"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $modelPath = Join-Path $modelDir "backbone.fp16.onnx"
          $modelUrl = "https://huggingface.co/itayinbar/Mishkefet-v1/resolve/main/onnx/backbone.fp16.onnx"
          Write-Host "Downloading ONNX model for the separate Release asset..."
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath
          $model = Get-Item $modelPath
          if ($model.Length -lt 50MB) {
            throw "The downloaded ONNX model is unexpectedly small ($($model.Length) bytes)."
          }
          Write-Host "ONNX model downloaded: $([math]::Round($model.Length / 1MB, 1)) MB"
          $licenseSource = Join-Path $env:GITHUB_WORKSPACE "models/mishkefet/LICENSE.txt"
          $licenseTarget = Join-Path $modelDir "LICENSE-Mishkefet.txt"
          if (Test-Path $licenseSource) {
            Copy-Item -LiteralPath $licenseSource -Destination $licenseTarget -Force
          } else {
            @(
              "Mishkefet-v1 ONNX model"
              "Source: https://huggingface.co/itayinbar/Mishkefet-v1"
              "License: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)."
              "The model weights and derivatives may not be used commercially. See the model repository for full terms and attribution."
            ) | Set-Content -Path $licenseTarget -Encoding utf8
          }

      - name: Create and verify application ZIP
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist/KtavYad"
          $runtimeDir = Join-Path $packageDir "Application/resources/runtime"
          $exePath = Join-Path $packageDir "Application/KtavYad.exe"
          $nextPackage = Join-Path $runtimeDir "node_modules/next/package.json"
          $nextEntry = Join-Path $runtimeDir "node_modules/next/dist/server/next.js"
          $readmePath = Join-Path $packageDir "README-Model.txt"
          foreach ($requiredFile in @($exePath,$nextPackage,$nextEntry,$readmePath)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required application file is missing before ZIP creation: $requiredFile"
            }
          }
          if ((Get-Item -LiteralPath $nextEntry).Length -lt 100KB) {
            throw "Next.js server entry file is unexpectedly small or incomplete."
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/KtavYad-Windows.zip"
          if (Test-Path $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $baseDir = (Resolve-Path -LiteralPath (Split-Path $packageDir -Parent)).Path
          $zipStream = [System.IO.File]::Open($zipPath,[System.IO.FileMode]::CreateNew,[System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::None)
          $zipArchive = [System.IO.Compression.ZipArchive]::new($zipStream,[System.IO.Compression.ZipArchiveMode]::Create,$false)
          $script:zipFileCount = 0
          $script:zipSkippedLinks = 0
          function Add-ZipDirectory([string]$Directory) {
            foreach ($item in Get-ChildItem -LiteralPath $Directory -Force) {
              $attributes = [System.IO.File]::GetAttributes($item.FullName)
              if (($attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                $script:zipSkippedLinks++
                Write-Host "Skipping reparse point: $($item.FullName)"
                continue
              }
              if (($attributes -band [System.IO.FileAttributes]::Directory) -ne 0) {
                Add-ZipDirectory $item.FullName
                continue
              }
              $relative = [System.IO.Path]::GetRelativePath($baseDir,$item.FullName).Replace('\','/')
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zipArchive,$item.FullName,$relative,[System.IO.Compression.CompressionLevel]::Optimal
              )
              $script:zipFileCount++
            }
          }
          try {
            Add-ZipDirectory $packageDir
          } finally {
            $zipArchive.Dispose()
          }
          Write-Host "ZIP files written: $script:zipFileCount; reparse points skipped: $script:zipSkippedLinks"

          # Reopen the actual ZIP, require the exact Next.js runtime entry, and
          # extract those entries to a clean folder to emulate the user's unzip.
          $checkArchive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $extractCheck = Join-Path $env:RUNNER_TEMP "ktavyad-zip-check"
          if (Test-Path $extractCheck) { Remove-Item -LiteralPath $extractCheck -Recurse -Force }
          $checkNodeModules = Join-Path $extractCheck "node_modules"
          $checkNextDir = Join-Path $checkNodeModules "next"
          New-Item -ItemType Directory -Force -Path (Join-Path $checkNextDir "dist/server") | Out-Null
          try {
            $entries = @($checkArchive.Entries | ForEach-Object { $_.FullName })
            $requiredEntries = @(
              "KtavYad/README-Model.txt"
              "KtavYad/Application/KtavYad.exe"
              "KtavYad/Application/resources/runtime/server.js"
              "KtavYad/Application/resources/runtime/node_modules/next/package.json"
              "KtavYad/Application/resources/runtime/node_modules/next/dist/server/next.js"
            )
            foreach ($requiredEntry in $requiredEntries) {
              if (-not ($entries -contains $requiredEntry)) {
                throw "Release ZIP is missing required entry: $requiredEntry"
              }
            }
            $packageEntry = $checkArchive.GetEntry("KtavYad/Application/resources/runtime/node_modules/next/package.json")
            $mainEntry = $checkArchive.GetEntry("KtavYad/Application/resources/runtime/node_modules/next/dist/server/next.js")
            if ($mainEntry.Length -lt 100KB) { throw "ZIP's next/dist/server/next.js entry is unexpectedly small." }
            foreach ($sourceEntry in @($packageEntry,$mainEntry)) {
              $relative = $sourceEntry.FullName.Substring("KtavYad/Application/resources/runtime/".Length).Replace('/',[System.IO.Path]::DirectorySeparatorChar)
              $destination = Join-Path $extractCheck $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              $inputStream = $sourceEntry.Open()
              $outputStream = [System.IO.File]::Open($destination,[System.IO.FileMode]::Create,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
              try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose() }
            }
          } finally {
            $checkArchive.Dispose()
          }
          $env:CTAV_ZIP_CHECK_NODE_MODULES = $checkNodeModules
          node -e "const p=require.resolve('next',{paths:[process.env.CTAV_ZIP_CHECK_NODE_MODULES]});if(!require('fs').existsSync(p))throw new Error('Resolved Next.js main file is missing after ZIP extraction: '+p);console.log('ZIP extraction check passed:',p)"
          if ($LASTEXITCODE -ne 0) { throw "Next.js cannot be resolved from the extracted ZIP contents." }
          $modelInAppZip = @($entries | Where-Object { $_.EndsWith("backbone.fp16.onnx",[System.StringComparison]::OrdinalIgnoreCase) })
          if ($modelInAppZip.Count -gt 0) { throw "The large ONNX model must be a separate Release asset, not inside the application ZIP." }
          $zip = Get-Item -LiteralPath $zipPath
          if ($zip.Length -lt 100MB) { throw "The generated application ZIP is unexpectedly small ($($zip.Length) bytes)." }
          Write-Host "Application ZIP fully verified: $($zip.FullName)"
          Write-Host "Verified ZIP entries: $($entries.Count)"
          Write-Host "Application ZIP size: $([math]::Round($zip.Length/1MB,1)) MB"
      - name: Upload Release ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KtavYad-Windows-Release-ZIP
          path: dist/KtavYad-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KtavYad v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/KtavYad-Windows.zip
            dist/model-asset/backbone.fp16.onnx
            dist/model-asset/LICENSE-Mishkefet.txt
          body: |
            חבילת Windows מלאה של KtavYad.

            **התקנה והפעלה**
            1. הורידו וחלצו את KtavYad-Windows.zip.
            2. הפעילו את KtavYad/Application/KtavYad.exe.
            3. להפעלת זיהוי כתב יד, העתיקו את backbone.fp16.onnx לתיקיית KtavYad/Application/models/mishkefet/.

            קובץ המודל הגדול מצורף בנפרד ל-Release בשם backbone.fp16.onnx ואינו נכלל ב-ZIP. קובצי העזר הקטנים כלולים בחבילה.
            רישיון המודל: CC BY-NC-SA 4.0; שימוש מסחרי אסור. קובץ הרישיון מצורף בנפרד.

name: Build and publish KtavYad Windows Release

on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - scripts/build-portable.ps1
      - scripts/test-portable-exe.ps1
      - .github/workflows/build-portable.yml

permissions:
  contents: write

# Keep only the newest build for this branch active. Avoid two concurrent
# runs racing to publish different builds as separate Releases.
concurrency:
  group: ktavyad-windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build unpacked folder with KtavYad.exe
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Download ONNX model for separate Release asset
        shell: pwsh
        run: |
          $modelDir = Join-Path $env:GITHUB_WORKSPACE "dist/model-asset"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $modelPath = Join-Path $modelDir "backbone.fp16.onnx"
          $modelUrl = "https://huggingface.co/itayinbar/Mishkefet-v1/resolve/main/onnx/backbone.fp16.onnx"
          Write-Host "Downloading ONNX model for the separate Release asset..."
          Invoke-WebRequest -Uri $modelUrl -OutFile $modelPath
          $model = Get-Item $modelPath
          if ($model.Length -lt 50MB) {
            throw "The downloaded ONNX model is unexpectedly small ($($model.Length) bytes)."
          }
          Write-Host "ONNX model downloaded: $([math]::Round($model.Length / 1MB, 1)) MB"
          $licenseSource = Join-Path $env:GITHUB_WORKSPACE "models/mishkefet/LICENSE.txt"
          $licenseTarget = Join-Path $modelDir "LICENSE-Mishkefet.txt"
          if (Test-Path $licenseSource) {
            Copy-Item -LiteralPath $licenseSource -Destination $licenseTarget -Force
          } else {
            @(
              "Mishkefet-v1 ONNX model"
              "Source: https://huggingface.co/itayinbar/Mishkefet-v1"
              "License: Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International (CC BY-NC-SA 4.0)."
              "The model weights and derivatives may not be used commercially. See the model repository for full terms and attribution."
            ) | Set-Content -Path $licenseTarget -Encoding utf8
          }

      - name: Smoke-test packaged Windows EXE with the real ONNX model
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-portable-exe.ps1

      - name: Create and verify application ZIP
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist/KtavYad"
          $runtimeDir = Join-Path $packageDir "Application/resources/runtime"
          $exePath = Join-Path $packageDir "Application/KtavYad.exe"
          $nextPackage = Join-Path $runtimeDir "node_modules/next/package.json"
          $nextEntry = Join-Path $runtimeDir "node_modules/next/dist/server/next.js"
          $readmePath = Join-Path $packageDir "README-Model.txt"
          foreach ($requiredFile in @($exePath,$nextPackage,$nextEntry,$readmePath)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required application file is missing before ZIP creation: $requiredFile"
            }
          }
          $nextEntryInfo = Get-Item -LiteralPath $nextEntry
          if ($nextEntryInfo.Length -lt 1) {
            throw "Next.js server entry file is empty."
          }
          $nextPackageInfo = Get-Content -LiteralPath $nextPackage -Raw | ConvertFrom-Json
          if (-not $nextPackageInfo.main) {
            throw "Next.js package.json does not define a main entry."
          }
          $declaredMain = Join-Path (Split-Path $nextPackage -Parent) $nextPackageInfo.main
          if (-not (Test-Path -LiteralPath $declaredMain -PathType Leaf)) {
            throw "Next.js package main entry is missing: $($nextPackageInfo.main)"
          }
          Write-Host "Next.js main entry verified: $($nextPackageInfo.main) ($($nextEntryInfo.Length) bytes)"

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/KtavYad-Windows.zip"
          if (Test-Path $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $baseDir = (Resolve-Path -LiteralPath (Split-Path $packageDir -Parent)).Path
          $zipStream = [System.IO.File]::Open($zipPath,[System.IO.FileMode]::CreateNew,[System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::None)
          $zipArchive = [System.IO.Compression.ZipArchive]::new($zipStream,[System.IO.Compression.ZipArchiveMode]::Create,$false)
          $script:zipFileCount = 0
          $script:zipSkippedLinks = 0
          function Add-ZipDirectory([string]$Directory) {
            foreach ($item in Get-ChildItem -LiteralPath $Directory -Force) {
              $attributes = [System.IO.File]::GetAttributes($item.FullName)
              if (($attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                $script:zipSkippedLinks++
                Write-Host "Skipping reparse point: $($item.FullName)"
                continue
              }
              if (($attributes -band [System.IO.FileAttributes]::Directory) -ne 0) {
                Add-ZipDirectory $item.FullName
                continue
              }
              $relative = [System.IO.Path]::GetRelativePath($baseDir,$item.FullName).Replace('\','/')
              [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $zipArchive,$item.FullName,$relative,[System.IO.Compression.CompressionLevel]::Optimal
              )
              $script:zipFileCount++
            }
          }
          try {
            Add-ZipDirectory $packageDir
          } finally {
            $zipArchive.Dispose()
          }
          Write-Host "ZIP files written: $script:zipFileCount; reparse points skipped: $script:zipSkippedLinks"

          # Reopen the actual ZIP, require the exact Next.js runtime entry, and
          # extract those entries to a clean folder to emulate the user's unzip.
          $checkArchive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $extractCheck = Join-Path $env:RUNNER_TEMP "ktavyad-zip-check"
          if (Test-Path $extractCheck) { Remove-Item -LiteralPath $extractCheck -Recurse -Force }
          $checkNodeModules = Join-Path $extractCheck "node_modules"
          $checkAliasModules = Join-Path $extractCheck ".next/node_modules"
          $checkAliasChunks = Join-Path $extractCheck ".next/server/chunks"
          New-Item -ItemType Directory -Force -Path $checkNodeModules,$checkAliasModules,$checkAliasChunks | Out-Null
          try {
            $entries = @($checkArchive.Entries | ForEach-Object { $_.FullName })
            $aliasPrefix = "KtavYad/Application/resources/runtime/.next/node_modules/"
            $aliasPackageJsonEntries = @($entries | Where-Object {
              $_.StartsWith($aliasPrefix,[System.StringComparison]::OrdinalIgnoreCase) -and $_.EndsWith("/package.json",[System.StringComparison]::OrdinalIgnoreCase)
            })
            $aliasNames = @()
            foreach ($aliasPackageJson in $aliasPackageJsonEntries) {
              $relativeAlias = $aliasPackageJson.Substring($aliasPrefix.Length)
              $parts = $relativeAlias.Split('/')
              $aliasName = if ($parts[0].StartsWith("@") -and $parts.Count -gt 2) { $parts[0] + "/" + $parts[1] } else { $parts[0] }
              $wrapperIndex = $aliasPrefix + $aliasName + "/index.cjs"
              if (-not ($entries -contains $wrapperIndex)) {
                throw "ZIP Turbopack alias wrapper is missing index.cjs: $aliasName"
              }
              $aliasNames += $aliasName
            }
            $aliasNames = @($aliasNames | Sort-Object -Unique)
            if (-not ($aliasNames | Where-Object { $_ -match '^onnxruntime-node-[0-9a-f]{8,32}$' })) {
              throw "ZIP is missing the onnxruntime-node Turbopack alias wrapper."
            }
            if (-not ($aliasNames | Where-Object { $_ -match '^jpeg-js-[0-9a-f]{8,32}$' })) {
              throw "ZIP is missing the jpeg-js Turbopack alias wrapper."
            }
            Write-Host "ZIP contains $($aliasNames.Count) Turbopack alias wrappers: $($aliasNames -join ', ')"
            $requiredEntries = @(
              "KtavYad/README-Model.txt"
              "KtavYad/Application/KtavYad.exe"
              "KtavYad/Application/resources/runtime/server.js"
              "KtavYad/Application/resources/runtime/node_modules/next/package.json"
              "KtavYad/Application/resources/runtime/node_modules/next/dist/server/next.js"
              "KtavYad/Application/resources/runtime/node_modules/@swc/helpers/package.json"
              "KtavYad/Application/resources/runtime/node_modules/@swc/helpers/esm/_interop_require_default.js"
              "KtavYad/Application/resources/runtime/node_modules/@swc/helpers/esm/_interop_require_wildcard.js"
            )
            foreach ($requiredEntry in $requiredEntries) {
              if (-not ($entries -contains $requiredEntry)) {
                throw "Release ZIP is missing required entry: $requiredEntry"
              }
            }
            $nextEntryInZip = $checkArchive.GetEntry("KtavYad/Application/resources/runtime/node_modules/next/dist/server/next.js")
            if ($nextEntryInZip.Length -lt 1) { throw "ZIP's Next.js main entry is empty." }
            if ($nextEntryInZip.Length -ne $nextEntryInfo.Length) { throw "ZIP's Next.js main entry size differs from the packaged source file." }

            # Extract ALL node_modules files from the real ZIP. A successful
            # require.resolve('next') alone does not prove Next's dependencies exist.
            $modulePrefix = "KtavYad/Application/resources/runtime/node_modules/"
            $moduleEntries = @($checkArchive.Entries | Where-Object {
              $_.FullName.StartsWith($modulePrefix,[System.StringComparison]::OrdinalIgnoreCase)
            })
            foreach ($sourceEntry in $moduleEntries) {
              if ([string]::IsNullOrEmpty($sourceEntry.Name)) { continue }
              $relative = $sourceEntry.FullName.Substring($modulePrefix.Length).Replace('/',[System.IO.Path]::DirectorySeparatorChar)
              $destination = Join-Path $checkNodeModules $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              $inputStream = $sourceEntry.Open()
              $outputStream = [System.IO.File]::Open($destination,[System.IO.FileMode]::Create,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
              try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose() }
            }
            Write-Host "Extracted $($moduleEntries.Count) node_modules ZIP entries for real dependency validation."

            # Extract the actual Turbopack alias wrapper packages from the ZIP.
            $aliasEntries = @($checkArchive.Entries | Where-Object {
              $_.FullName.StartsWith($aliasPrefix,[System.StringComparison]::OrdinalIgnoreCase)
            })
            foreach ($sourceEntry in $aliasEntries) {
              if ([string]::IsNullOrEmpty($sourceEntry.Name)) { continue }
              $relative = $sourceEntry.FullName.Substring($aliasPrefix.Length).Replace('/',[System.IO.Path]::DirectorySeparatorChar)
              $destination = Join-Path $checkAliasModules $relative
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              $inputStream = $sourceEntry.Open()
              $outputStream = [System.IO.File]::Open($destination,[System.IO.FileMode]::Create,[System.IO.FileAccess]::Write,[System.IO.FileShare]::None)
              try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose(); $inputStream.Dispose() }
            }
            Write-Host "Extracted $($aliasEntries.Count) Turbopack alias wrapper entries from the real ZIP."
          } finally {
            $checkArchive.Dispose()
          }
          $env:CTAV_ZIP_CHECK_NODE_MODULES = $checkNodeModules
          $env:CTAV_ZIP_CHECK_ALIASES = $aliasNames -join ";"
          node -e "const path=require('path'),{createRequire}=require('module'),root=process.env.CTAV_ZIP_CHECK_NODE_MODULES,req=createRequire(path.join(root,'..','.next','server','chunks','__zipcheck__.cjs')),pkg=req('next/package.json'),resolved=req.resolve('next');if(!pkg.main)throw new Error('Next.js package.json has no main entry');if(path.resolve(path.dirname(req.resolve('next/package.json')),pkg.main)!==path.resolve(resolved))throw new Error('Next.js main path mismatch');req(resolved);const swc=req.resolve('@swc/helpers/_/_interop_require_default'),d=req('@swc/helpers/_/_interop_require_default'),w=req('@swc/helpers/_/_interop_require_wildcard');req(swc);const aliases=(process.env.CTAV_ZIP_CHECK_ALIASES||'').split(';').filter(Boolean);for(const name of aliases)console.log('ZIP alias resolves:',name,'=>',req.resolve(name));console.log('Full ZIP runtime dependencies passed:',resolved,'; SWC:',swc,'; helper exports:',typeof d._,typeof w._,'; Turbopack aliases:',aliases.length)"
          if ($LASTEXITCODE -ne 0) { throw "Next.js, SWC or a Turbopack alias cannot be resolved from the extracted ZIP contents." }
          Remove-Item Env:CTAV_ZIP_CHECK_ALIASES -ErrorAction SilentlyContinue
          $modelInAppZip = @($entries | Where-Object { $_.EndsWith("backbone.fp16.onnx",[System.StringComparison]::OrdinalIgnoreCase) })
          if ($modelInAppZip.Count -gt 0) { throw "The large ONNX model must be a separate Release asset, not inside the application ZIP." }
          $zip = Get-Item -LiteralPath $zipPath
          if ($zip.Length -lt 100MB) { throw "The generated application ZIP is unexpectedly small ($($zip.Length) bytes)." }
          Write-Host "Application ZIP fully verified: $($zip.FullName)"
          Write-Host "Verified ZIP entries: $($entries.Count)"
          Write-Host "Application ZIP size: $([math]::Round($zip.Length/1MB,1)) MB"
      - name: Upload Release ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KtavYad-Windows-Release-ZIP
          path: dist/KtavYad-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: v1.0.${{ github.run_number }}
          name: KtavYad v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/KtavYad-Windows.zip
            dist/model-asset/backbone.fp16.onnx
            dist/model-asset/LICENSE-Mishkefet.txt
          body: |
            חבילת Windows מלאה של KtavYad.

            **התקנה והפעלה**
            1. הורידו וחלצו את KtavYad-Windows.zip.
            2. הפעילו את KtavYad/Application/KtavYad.exe.
            3. בהפעלה הראשונה בחרו בחלון שייפתח את קובץ backbone.fp16.onnx; התוכנה תעתיק אותו אוטומטית למיקום המתאים.

            קובץ המודל הגדול מצורף בנפרד ל-Release בשם backbone.fp16.onnx ואינו נכלל ב-ZIP. קובצי העזר הקטנים כלולים בחבילה.
            רישיון המודל: CC BY-NC-SA 4.0; שימוש מסחרי אסור. קובץ הרישיון מצורף בנפרד.

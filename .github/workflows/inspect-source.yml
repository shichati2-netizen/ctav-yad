name: Inspect ctav-yad source
on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - .github/workflows/inspect-source.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime storage paths
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Filter '*.zip' -File | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'ctav-yad-src'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $dest -Force
          foreach ($relative in @('src/lib/dataset.ts','src/lib/mishkefet/engine.ts','src/db/schema.ts','src/app/api/lines/[id]/route.ts','src/app/api/adapt/route.ts','drizzle.config.json')) {
            $path = Join-Path $dest $relative
            if (Test-Path $path) {
              Write-Host ('===== FILE: ' + $relative + ' =====')
              Get-Content -Raw $path | Write-Host
            }
          }

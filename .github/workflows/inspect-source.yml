name: Inspect ctav-yad source
on:
  workflow_dispatch:
  push:
    paths:
      - self-training-hebrew-handwriting-ocr.zip
      - .github/workflows/inspect-source.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect source files
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Filter '*.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'ZIP not found' }
          $dest = Join-Path $env:RUNNER_TEMP 'ctav-yad-src'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $dest -Force
          $files = Get-ChildItem $dest -Recurse -File
          Write-Host ('FILE COUNT: ' + $files.Count)
          $files | Select-Object -First 500 FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
          foreach ($relative in @('package.json','next.config.ts','drizzle.config.json','drizzle.config.ts','README.md','src/db/index.ts','src/lib/model.ts','src/lib/ocr.ts','src/lib/vision.ts','src/lib/serverOcr.ts','src/app/api/health/route.ts','src/app/api/model/route.ts','src/app/api/ocr/route.ts','src/app/api/recognize/route.ts','src/app/api/train/route.ts')) {
            $path = Join-Path $dest $relative
            if (Test-Path $path) {
              Write-Host ('===== FILE: ' + $relative + ' =====')
              Get-Content -Raw $path | Write-Host
            }
          }
          Write-Host '=== MODEL / DATA ASSETS ==='
          $files | Where-Object { $_.FullName -match 'models|public|\.wasm$|\.onnx$|\.bin$|\.npz$|\.pt$|\.pth$|\.json$|\.db$|\.sqlite$' } | Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
